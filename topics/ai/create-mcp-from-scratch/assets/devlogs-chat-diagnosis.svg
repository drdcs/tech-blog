<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="AI chat diagnosing a local API error using devlogs MCP tools">
  <defs>
    <linearGradient id="topbar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="920" height="520" fill="#111827"/>
  <rect x="26" y="24" width="868" height="472" rx="10" fill="#1e1e1e" filter="url(#shadow)"/>
  <rect x="26" y="24" width="868" height="38" rx="10" fill="url(#topbar)"/>
  <circle cx="48" cy="43" r="6" fill="#ef4444"/>
  <circle cx="68" cy="43" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="43" r="6" fill="#22c55e"/>
  <text x="122" y="48" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Cursor Chat - Agent mode</text>

  <rect x="44" y="82" width="390" height="386" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="62" y="112" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">logs/dev.log</text>
  <text x="62" y="143" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">1204 | INFO  GET /api/orders/42 500 81ms</text>
  <text x="62" y="170" fill="#f87171" font-family="JetBrains Mono, monospace" font-size="12">1205 | ERROR PrismaClientKnownRequestError</text>
  <text x="62" y="197" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">1206 | Invalid `db.order.findUnique()` call</text>
  <text x="62" y="224" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">1207 | Unknown argument `includeItems`</text>
  <text x="62" y="251" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">1208 | at src/api/orders.ts:47:21</text>
  <text x="62" y="278" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">1209 | request_id=req_dev_84fb</text>
  <text x="62" y="320" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="12">tail window: 300 lines</text>
  <text x="62" y="347" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="12">source: local file only</text>

  <rect x="464" y="82" width="412" height="386" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="486" y="106" width="258" height="52" rx="8" fill="#e0f2fe"/>
  <text x="506" y="130" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Why did my last local API call fail?</text>
  <text x="506" y="150" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">Check the dev logs, please.</text>

  <rect x="486" y="184" width="226" height="34" rx="17" fill="#ecfdf5" stroke="#10b981"/>
  <text x="506" y="206" fill="#065f46" font-family="JetBrains Mono, monospace" font-size="12">tool: devlogs_last_error</text>

  <rect x="486" y="236" width="366" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="506" y="264" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Likely cause</text>
  <text x="506" y="292" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">The API still calls `includeItems`, but the Prisma</text>
  <text x="506" y="314" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">query schema no longer accepts that argument.</text>
  <text x="506" y="346" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Open `src/api/orders.ts:47` and replace it with</text>
  <text x="506" y="368" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">the generated relation include shape.</text>

  <rect x="486" y="424" width="228" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="505" y="442" fill="#1d4ed8" font-family="JetBrains Mono, monospace" font-size="11">evidence: lines 1205-1208</text>
</svg>
