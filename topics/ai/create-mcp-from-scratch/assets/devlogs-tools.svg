<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="MCP tool list for mcp-server-devlogs">
  <rect width="920" height="520" fill="#0f172a"/>
  <rect x="32" y="30" width="856" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="32" y="30" width="856" height="58" rx="10" fill="#ffffff"/>
  <text x="58" y="66" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">MCP Servers</text>
  <rect x="726" y="48" width="126" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="748" y="65" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">devlogs running</text>

  <rect x="58" y="116" width="250" height="330" rx="8" fill="#0f172a"/>
  <text x="82" y="150" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">mcp-server-devlogs</text>
  <text x="82" y="178" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">transport: stdio</text>
  <text x="82" y="202" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">log: logs/dev.log</text>
  <text x="82" y="226" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">window: 300 lines</text>
  <rect x="82" y="264" width="162" height="30" rx="15" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="104" y="284" fill="#ecfdf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">read-only local</text>

  <rect x="340" y="116" width="250" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="364" y="150" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Tools</text>
  <rect x="364" y="176" width="198" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="382" y="200" fill="#1d4ed8" font-family="JetBrains Mono, monospace" font-size="12">devlogs_recent</text>
  <text x="382" y="218" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="11">latest N lines</text>
  <rect x="364" y="248" width="198" height="52" rx="6" fill="#fff7ed" stroke="#fdba74"/>
