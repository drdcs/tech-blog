  <rect x="364" y="320" width="198" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="382" y="344" fill="#15803d" font-family="JetBrains Mono, monospace" font-size="12">devlogs_grep</text>
  <text x="382" y="362" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="11">regex recent logs</text>

  <rect x="622" y="116" width="240" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="646" y="150" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Resources &amp; Prompts</text>
