  <rect x="646" y="260" width="188" height="58" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="664" y="284" fill="#6d28d9" font-family="JetBrains Mono, monospace" font-size="12">debug_last_failure</text>
