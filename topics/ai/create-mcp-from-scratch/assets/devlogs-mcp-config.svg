<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Editor screenshot showing mcp-server-devlogs configuration and running process">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="920" height="520" fill="url(#bg)"/>
  <rect x="28" y="28" width="864" height="464" rx="10" fill="#1e1e1e" stroke="#334155"/>
  <rect x="28" y="28" width="864" height="36" rx="10" fill="#111827"/>
  <circle cx="50" cy="46" r="5.5" fill="#ef4444"/>
  <circle cx="70" cy="46" r="5.5" fill="#f59e0b"/>
  <circle cx="90" cy="46" r="5.5" fill="#22c55e"/>
  <text x="122" y="50" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">mcp-server-devlogs/.cursor/mcp.json</text>

  <rect x="48" y="84" width="508" height="376" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="70" y="115" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">1</text>
  <text x="100" y="115" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">{</text>
  <text x="70" y="140" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">2</text>
  <text x="100" y="140" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">"servers"</text>
  <text x="165" y="140" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">: {</text>
  <text x="70" y="165" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">3</text>
  <text x="122" y="165" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">"devlogs"</text>
  <text x="188" y="165" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">: {</text>
  <text x="70" y="190" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">4</text>
  <text x="144" y="190" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">"command"</text>
  <text x="213" y="190" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">: </text>
  <text x="230" y="190" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="12">".venv/bin/python"</text>
  <text x="70" y="215" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">5</text>
  <text x="144" y="215" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">"args"</text>
  <text x="190" y="215" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">: [</text>
  <text x="70" y="240" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">6</text>
  <text x="166" y="240" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="12">"server.py"</text>
  <text x="70" y="265" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">7</text>
  <text x="144" y="265" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">],</text>
  <text x="70" y="290" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">8</text>
  <text x="144" y="290" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">"env"</text>
  <text x="183" y="290" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">: {</text>
  <text x="70" y="315" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">9</text>
  <text x="166" y="315" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">"DEVLOG_PATH"</text>
  <text x="270" y="315" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">: </text>
  <text x="287" y="315" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="12">"${workspaceFolder}/logs/dev.log"</text>
  <text x="70" y="340" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">10</text>
  <text x="144" y="340" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">}</text>
  <text x="70" y="365" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">11</text>
  <text x="122" y="365" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">}</text>
  <text x="70" y="390" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">12</text>
  <text x="100" y="390" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">}</text>
  <text x="70" y="415" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">13</text>
  <text x="100" y="415" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">}</text>

  <rect x="586" y="84" width="274" height="376" rx="7" fill="#020617" stroke="#334155"/>
  <text x="608" y="116" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">$ npm run dev 2&gt;&amp;1 | tee logs/dev.log</text>
  <text x="608" y="150" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="12">ready on http://localhost:3000</text>
  <text x="608" y="184" fill="#f87171" font-family="JetBrains Mono, monospace" font-size="12">ERROR route=/api/orders/42</text>
  <text x="608" y="208" fill="#f87171" font-family="JetBrains Mono, monospace" font-size="12">Unknown argument includeItems</text>
  <text x="608" y="254" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">$ .venv/bin/python server.py</text>
  <text x="608" y="288" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">FastMCP devlogs over stdio</text>
  <text x="608" y="312" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">watching logs/dev.log</text>
  <rect x="608" y="356" width="144" height="30" rx="15" fill="#064e3b" stroke="#10b981"/>
  <text x="628" y="376" fill="#ecfdf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">MCP Running</text>
</svg>
